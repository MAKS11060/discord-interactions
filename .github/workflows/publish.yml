name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-package-json:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # with:
        #   token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      # Парсим версию и динамически определяем npm-тег (latest, beta, rc)
      - name: Parse Version & Determine Tag
        id: parse
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$GIT_TAG" >> $GITHUB_OUTPUT

          if [[ "$GIT_TAG" == *"-"* ]]; then
            # Извлекаем префикс (например, из 1.0.0-beta.0 получим beta)
            PRE_TYPE=$(echo "$GIT_TAG" | sed -E 's/.*-([a-z]+)\..*/\1/')
            echo "npm_tag=$PRE_TYPE" >> $GITHUB_OUTPUT
          else
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        run: |
          VERSION=${{ steps.parse.outputs.version }}

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          pnpm pkg set version=$VERSION

          git add package.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Install dependencies and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build --if-present

      # - name: Publish Package
      #   run: pnpm publish --no-git-checks --tag ${{ steps.parse.outputs.npm_tag }}

      # - name: Publish Release
      #   uses: softprops/action-gh-release@v2
